<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Festival Sign</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="setup">
    <h1>Festival Sign</h1>

    <label class="field">
      <span>Text</span>
      <input id="text" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Type your text">
    </label>

    <label class="toggle">
      <input id="fit" type="checkbox">
      <span>
        <strong>Fit to screen</strong>
        <small>Shrink and wrap the text so it all fits. When off, letters fill the full screen height and long text scrolls.</small>
      </span>
    </label>

    <div class="colors">
      <label class="field color">
        <span>Text color</span>
        <input id="fg" type="color" value="#ffd600">
      </label>
      <label class="field color">
        <span>Background color</span>
        <input id="bg" type="color" value="#000000">
      </label>
    </div>

    <label class="field">
      <span class="slider-label">Letter width <output id="width-value">100%</output></span>
      <input id="width" type="range" min="40" max="100" step="5" value="100">
    </label>

    <label class="field">
      <span class="slider-label">Blink speed <output id="blink-value">Off</output></span>
      <input id="blink" type="range" min="0" max="3" step="0.5" value="0">
    </label>

    <div id="preview" class="preview" aria-hidden="true"><span id="preview-text"></span></div>

    <button id="show" type="button">Show</button>
  </main>

  <div id="display" hidden>
    <canvas id="canvas"></canvas>
    <div id="hint">Double-tap to go back</div>
  </div>

  <script src="app.js"></script>
</body>
</html>
